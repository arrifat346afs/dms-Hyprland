general {
    col.active_border = rgba(9a8d9aAA)
    col.inactive_border = rgba(4e434fAA)
}

misc {
    background_color = rgba(171217FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(171217FF)
        col.text = rgba(eadfe7FF)


        # example buttons (R -> L)
        # hyprbars-button = color, size, on-click
        hyprbars-button = rgb(eadfe7), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(eadfe7), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(eadfe7), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(f0b0ffAA) rgba(f0b0ff77),pinned:1
